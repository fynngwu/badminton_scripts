<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>羽毛球场预约</title>
<style>
:root{
  --bg:#0d1117;
  --bg-elev:#161b22;
  --bg-input:#0b0f16;
  --border:#262d38;
  --border-strong:#39414d;
  --text:#e6edf3;
  --text-dim:#8b949e;
  --text-mute:#6b7280;
  --primary:#2f81f7;
  --primary-hover:#4b95f9;
  --success:#2ea043;
  --success-hover:#3fb950;
  --purple:#a371f7;
  --orange:#f0883e;
}

* { box-sizing: border-box; }

html { color-scheme: dark; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
       "PingFang SC", "Microsoft YaHei", sans-serif;
  max-width: 1080px; margin: 24px auto; padding: 0 20px;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(1100px 560px at 15% -12%, rgba(47,129,247,.13), transparent 62%),
    radial-gradient(900px 520px at 100% 0%, rgba(163,113,247,.10), transparent 58%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: 22px; margin: 0 0 18px; font-weight: 700; letter-spacing: .3px; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  padding: 12px 16px; border-radius: 10px;
  box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 28px -20px rgba(0,0,0,.9);
  margin-bottom: 12px;
}

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row label { font-size: 13px; color: var(--text-dim); }

input, select {
  padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 13px;
  background: var(--bg-input); color: var(--text);
  transition: border-color .15s, box-shadow .15s, background .15s;
}
input::placeholder { color: #58616e; }
input:hover, select:hover { border-color: var(--border-strong); }
input:focus, select:focus {
  outline: none; border-color: var(--primary);
  background: #0e1520;
  box-shadow: 0 0 0 3px rgba(47,129,247,.18);
}
select option { background: var(--bg-elev); color: var(--text); }

#token { flex: 1; min-width: 260px; }

button {
  padding: 7px 16px; border: 1px solid transparent; border-radius: 6px;
  cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background .15s, border-color .15s, filter .15s, transform .06s;
}
button:active:enabled { transform: translateY(1px); }
button:disabled {
  background: #21262d !important; color: #55606e !important;
  border-color: var(--border) !important; cursor: not-allowed;
}

.primary { background: var(--primary); color: #fff; }
.primary:hover:enabled { background: var(--primary-hover); }

.auto { background: linear-gradient(180deg, #3b8ef8, #1f6feb); color: #fff; }
.auto:hover:enabled { filter: brightness(1.12); }

.dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #3a4351; transition: background .2s, box-shadow .2s;
}
.dot.on { background: var(--success-hover); box-shadow: 0 0 0 3px rgba(63,185,80,.16); }

.mini {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 12px; color: var(--text-dim);
}

.section { margin-top: 18px; }
.section h2 {
  font-size: 14px; color: #c3cbd6; margin: 0 0 8px;
  padding-left: 8px; border-left: 3px solid var(--primary);
  font-weight: 600;
}

.grid, .avail-grid { display: flex; flex-wrap: wrap; gap: 8px; }

.court {
  padding: 10px 18px; border-radius: 8px; font-size: 13px;
  background: linear-gradient(180deg, #3588f8, #1f6feb);
  color: #fff; cursor: pointer; text-align: center;
  min-width: 66px; user-select: none;
  border: 1px solid rgba(255,255,255,.10);
  box-shadow: 0 1px 2px rgba(0,0,0,.45);
  transition: filter .15s, box-shadow .15s, transform .06s;
}
.court:hover {
  filter: brightness(1.12);
  box-shadow: 0 6px 18px -6px rgba(47,129,247,.75);
}
.court:active { transform: translateY(1px); }

.avail-btn {
  padding: 9px 16px; border-radius: 8px; font-size: 13px;
  background: linear-gradient(180deg, #2ea043, #217a33);
  color: #fff; border: 1px solid rgba(255,255,255,.10); cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.45);
  transition: filter .15s, box-shadow .15s, transform .06s;
}
.avail-btn:hover {
  filter: brightness(1.14);
  box-shadow: 0 6px 18px -6px rgba(63,185,80,.7);
}
.avail-btn:active { transform: translateY(1px); }

.hint { color: var(--text-mute); font-size: 12px; padding: 6px 0; }

.log {
  background: #080b10; color: #c9d1d9;
  border: 1px solid var(--border);
  padding: 10px 14px; border-radius: 8px;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 12px; max-height: 320px; overflow-y: auto;
  margin-top: 18px; white-space: pre-wrap; line-height: 1.55;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
}
.log .l-INFO { color: #7ee787; }
.log .l-WARNING { color: #ffa657; }
.log .l-ERROR { color: #ff7b72; }

.pill {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  background: #21262d; border: 1px solid var(--border);
  color: var(--text); font-size: 12px;
}

/* ── 已被占用面板：基础样式 ───────────────────────────── */
.occ-group {
  border-left: 3px solid #2c3440;
  padding: 6px 0 8px 10px;
  margin-bottom: 10px;
}
.occ-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px; flex-wrap: wrap;
}
.occ-name { font-size: 13px; font-weight: 600; color: #c9d1d9; }
.occ-tag {
  font-size: 11px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid; white-space: nowrap;
}
.occ-tag.person { color: #79c0ff; border-color: #1f4b7a; background: #0d2338; }
.occ-tag.course { color: #d2a8ff; border-color: #4a3670; background: #1d1630; }
.occ-items { display: flex; flex-wrap: wrap; gap: 6px; }
.occ-item {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 11.5px; padding: 3px 8px; border-radius: 5px;
  background: #161d27; border: 1px solid #262d38; color: #8b949e;
}

/* ── 已被占用面板：分类结构 ───────────────────────────── */
.occ-category { margin-bottom: 20px; }
.occ-cat-title {
  font-size: 13px; color: #c3cbd6;
  margin: 0 0 10px 0; padding-bottom: 6px;
  border-bottom: 1px dashed #262d38;
  font-weight: 600;
}
.occ-cat-title .mini { font-weight: normal; color: #6b7280; }

/* 课程行 */
.occ-courses { display: flex; flex-direction: column; gap: 6px; }
.course-row { display: flex; align-items: center; gap: 12px; font-size: 12px; }
.course-time {
  font-family: "SFMono-Regular", Consolas, monospace;
  color: #d2a8ff; background: #1d1630;
  padding: 2px 8px; border-radius: 4px;
  border: 1px solid #4a3670;
  min-width: 120px; text-align: center;
}
.course-courts {
  color: #8b949e;
  font-family: "SFMono-Regular", Consolas, monospace;
}

/* 折叠框 */
.occ-fold {
  margin-top: 16px;
  border-top: 1px solid #262d38;
  padding-top: 12px;
}
.occ-fold summary {
  cursor: pointer;
  font-size: 12px;
  color: #6b7280;
  user-select: none;
  outline: none;
}
.occ-fold summary:hover { color: #8b949e; }

/* 起始时间标签（通用） */
.start-time {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 12px;
  padding: 1px 8px;
  border-radius: 4px;
  letter-spacing: .3px;
}
/* 空闲用绿色 */
.start-time.free {
  color: #7ee787;
  background: #0d2818;
  border: 1px solid #1f5a2e;
}
/* 散客用蓝色 */
.start-time.day {
  color: #79c0ff;
  background: #0d2338;
  border: 1px solid #1f4b7a;
}

/* 滚动条 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: #2b333f; border-radius: 6px;
  border: 2px solid transparent; background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: #3c4552; background-clip: content-box; }

/* 高亮数字 */
#vid-count, #cur-date { color: var(--text); font-weight: 600; }
</style>
</head>
<body>

<h1>🏸 羽毛球场预约</h1>

<div class="card row">
  <label>Token</label>
  <input id="token" placeholder="粘贴 token">
  <label>日期</label>
  <select id="date-offset">
    <option value="0">今天</option>
    <option value="1" selected>明天</option>
    <option value="2">后天</option>
  </select>
  <button class="primary" id="btn-save">保存</button>
  <span class="mini">目标：<b id="cur-date">-</b></span>
</div>

<div class="card row">
  <span>VID 缓存：<b id="vid-count">0</b></span>
  <span class="mini"><span class="dot" id="sse-dot"></span>SSE</span>
  <button class="primary" id="btn-vid">启动 VID</button>
  <button class="primary" id="btn-refresh">刷新场地</button>
  <span class="mini" id="last-solve">最近 solve：-</span>
</div>

<div class="card row">
  <label style="font-weight:700;">全自动</label>
  <label>时段</label>
  <select id="auto-ss"></select>
  <span style="color:#a371f7;">—</span>
  <select id="auto-se"></select>
  <label>触发</label><input id="auto-rt" value="20:00:01" style="width:85px">
  <label>申请</label><input id="auto-st" value="20:00:04" style="width:85px">
  <label>最多</label>
  <input id="auto-mo" type="number" value="3" min="1" max="10" style="width:55px">
  <button class="auto" id="btn-auto">启动全自动</button>
</div>

<div class="card" id="auto-status" style="display:none">
  <span class="pill" id="auto-phase">idle</span>
  <span class="mini" id="auto-msg" style="margin-left:10px;"></span>
  <div class="mini" style="margin-top:8px;">候选：<span id="auto-cands">无</span></div>
  <div class="mini">已申请：<span id="auto-applied">无</span></div>
</div>

<div class="section">
  <h2>可抢场地 <span class="mini" style="font-weight:normal;color:#6b7280;">
    (按起始时间倒序 · 每段最多合并 2 小时)</span></h2>
  <div id="free"></div>
</div>

<div class="section">
  <h2>已被占用</h2>
  <div id="occupied"></div>
</div>

<div class="log" id="log"></div>

<script>
const $ = id => document.getElementById(id);

/* ── 时段下拉：全部 30 分钟粒度 ─────────────────────────────
   起始：08:00 ~ 21:30
   结束：08:30 ~ 22:00
   默认选中 20:00 / 22:00
──────────────────────────────────────────────────────── */
function fillTimeSelect(sel, fromMin, toMin, defValue) {
  for (let m = fromMin; m <= toMin; m += 30) {
    const hh = String(Math.floor(m / 60)).padStart(2, "0");
    const mm = String(m % 60).padStart(2, "0");
    const val = `${hh}:${mm}`;
    const opt = document.createElement("option");
    opt.value = opt.textContent = val;
    if (val === defValue) opt.selected = true;
    sel.appendChild(opt);
  }
}
fillTimeSelect($("auto-ss"), 8 * 60, 21 * 60 + 30, "20:00");
fillTimeSelect($("auto-se"), 8 * 60 + 30, 22 * 60,   "22:00");

/* ── 全局状态 ─────────────────────────────────────────── */
const SCAN_START = 8 * 60;      // 08:00
const SCAN_END   = 22 * 60;     // 22:00
const MAX_SLOTS  = 4;           // 每个块最多 4 × 30min = 2h

let lastLog = 0, sse = null;
let vidRunning = false, autoRunning = false, refreshRunning = false;
let freeByStart = {};   // "20:00" -> [{court, start, end}]
let occByCourt  = {};   // 场地号 -> [ {start,end,status,name,code,tel,type} ]

const escHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const fmtMin = m =>
  String(Math.floor(m / 60)).padStart(2, "0") + ":" +
  String(m % 60).padStart(2, "0");

/* ── 活动关键词 ── */
const ACTIVITY_KEYWORDS = [
  "工会", "比赛", "活动", "大会", "赛", "训练",
  "校队", "俱乐部", "考试", "赛事", "选拔",
];
function isActivity(name) {
  if (!name) return false;
  return ACTIVITY_KEYWORDS.some(kw => name.includes(kw));
}

function isEvening(start) {
  return start >= "18:00" && start <= "21:30";
}

/* ── 判断某个时间片是否空闲（兼容 "8:00" / "08:00"） ── */
function isFree(avail, t) {
  if (!avail) return false;
  if (avail[t] === "1") return true;
  const p = t.split(":");
  return avail[p[0].padStart(2, "0") + ":" + p[1]] === "1"
      || avail[String(+p[0]) + ":" + p[1]] === "1";
}

/* ── 计算单个场地的所有空闲块 ──
   从 SCAN_START 扫到 SCAN_END：
     1) 找连续空闲段 [i, j)
     2) 从 i 起，每 MAX_SLOTS 个 30min slot 切一块
*/
function computeRuns(avail) {
  const runs = [];
  let i = SCAN_START;
  while (i < SCAN_END) {
    if (!isFree(avail, fmtMin(i))) { i += 30; continue; }
    let j = i;
    while (j < SCAN_END && isFree(avail, fmtMin(j))) j += 30;

    let s = i;
    while (s < j) {
      const e = Math.min(s + MAX_SLOTS * 30, j);
      runs.push({ start: fmtMin(s), end: fmtMin(e) });
      s += MAX_SLOTS * 30;
    }
    i = j;
  }
  return runs;
}

/* ── 把同一场地里「同一个人 + 时间连续」的 block 合并成一个区间 ── */
function mergeBlocks(blocks) {
  const busy = blocks.filter(b => b && b.status != null && b.status !== "1");
  const out = [];
  for (const b of busy) {
    const key = b.customerName || `__s${b.status}__`;
    const last = out[out.length - 1];
    if (last && last._k === key && last.end === b.time) {
      last.end = b.endTime;
      continue;
    }
    out.push({
      _k: key,
      start: b.time, end: b.endTime,
      status: b.status,
      name:   b.customerName,
      code:   b.customerCode,
      tel:    b.customerTel,
      type:   b.type,
    });
  }
  return out;
}

/* ── 按人名聚合 ── */
function groupByName(spans) {
  const map = new Map();
  for (const sp of spans) {
    const key = sp.name || "未知";
    if (!map.has(key)) {
      map.set(key, {
        name: key, code: sp.code, tel: sp.tel,
        type: sp.type, status: sp.status, spans: [],
      });
    }
    map.get(key).spans.push(sp);
  }
  return [...map.values()].sort((a, b) =>
    a.name.localeCompare(b.name, "zh-Hans-CN"));
}

/* ══════════════════════════════════════════════════════
   渲染：可抢场地（动态 · 按起始时间倒序分桶）
══════════════════════════════════════════════════════ */
function renderFree() {
  const box = $("free");
  const starts = Object.keys(freeByStart).sort().reverse();  // 越晚越前
  if (!starts.length) {
    box.innerHTML = `<div class="hint">暂无空闲场地</div>`;
    return;
  }

  box.innerHTML = starts.map(st => {
    const items = [...freeByStart[st]]
      .sort((a, b) => a.court - b.court || a.end.localeCompare(b.end));
    const rows = items.map(i =>
      `<button class="avail-btn"
        data-court="${i.court}" data-start="${i.start}" data-end="${i.end}">
        ${i.court}号场 · ${i.start}-${i.end}
      </button>`).join("");
    return `<div class="occ-group" style="border-left-color:#2ea043;">
      <div class="occ-head">
        <span class="start-time free">${escHtml(st)} 起</span>
        <span class="mini">${items.length} 个场地</span>
      </div>
      <div class="avail-grid">${rows}</div>
    </div>`;
  }).join("");
}

/* ══════════════════════════════════════════════════════
   渲染：已被占用（分类 · 分层）
══════════════════════════════════════════════════════ */
function renderOccupied() {
  const allSpans = [];
  for (const cno in occByCourt) {
    for (const sp of occByCourt[cno]) {
      allSpans.push({ ...sp, court: +cno });
    }
  }

  const box = $("occupied");
  if (!allSpans.length) {
    box.innerHTML = `<div class="hint">暂无占用信息</div>`;
    return;
  }

  const courses = [], activities = [], evening = [], day = [];
  for (const sp of allSpans) {
    if (sp.status === "0")               courses.push(sp);
    else if (isActivity(sp.name))        activities.push(sp);
    else if (isEvening(sp.start))        evening.push(sp);
    else                                 day.push(sp);
  }

  let html = "";

  // ── 课程时间 ──
  if (courses.length) {
    courses.sort((a, b) => a.start.localeCompare(b.start) || a.court - b.court);
    const timeGroups = new Map();
    for (const c of courses) {
      const k = `${c.start}-${c.end}`;
      if (!timeGroups.has(k)) timeGroups.set(k, []);
      if (!timeGroups.get(k).includes(c.court)) timeGroups.get(k).push(c.court);
    }
    html += `<div class="occ-category">
      <h3 class="occ-cat-title">📚 课程时间 <span class="mini">(固定占用)</span></h3>
      <div class="occ-courses">`;
    for (const time of [...timeGroups.keys()].sort()) {
      const courts = timeGroups.get(time).sort((a, b) => a - b);
      html += `<div class="course-row">
        <span class="course-time">${escHtml(time)}</span>
        <span class="course-courts">${courts.map(c => c + "号场").join(" / ")}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── 活动/团体征用 ──
  if (activities.length) {
    html += `<div class="occ-category">
      <h3 class="occ-cat-title">🏆 活动 / 团体征用</h3>`;
    for (const g of groupByName(activities)) {
      const items = g.spans
        .sort((a, b) => a.start.localeCompare(b.start) || a.court - b.court)
        .map(s => `<span class="occ-item">${s.court}号场 ${escHtml(s.start)}-${escHtml(s.end)}</span>`)
        .join("");
      html += `<div class="occ-group" style="border-left-color:#a371f7;">
        <div class="occ-head">
          <span class="occ-name">${escHtml(g.name)}</span>
          <span class="occ-tag course">征用 / 活动</span>
          <span class="mini">共 ${g.spans.length} 段${g.type ? " · " + escHtml(g.type) : ""}</span>
        </div>
        <div class="occ-items">${items}</div>
      </div>`;
    }
    html += `</div>`;
  }

  // ── 晚间热门 18:00-22:00 个人 ──
  if (evening.length) {
    html += `<div class="occ-category">
      <h3 class="occ-cat-title">🔥 晚间热门时段抢场者 <span class="mini">(18:00-22:00)</span></h3>`;
    for (const g of groupByName(evening)) {
      const items = g.spans
        .sort((a, b) => a.start.localeCompare(b.start) || a.court - b.court)
        .map(s => `<span class="occ-item" style="background:#2a1f3d;border-color:#4a3670;color:#d2a8ff;">${s.court}号场 ${escHtml(s.start)}-${escHtml(s.end)}</span>`)
        .join("");
      const meta = [g.code, g.tel, g.type].filter(Boolean).join(" · ");
      html += `<div class="occ-group" style="border-left-color:#f0883e;">
        <div class="occ-head">
          <span class="occ-name" style="color:#f0883e;">${escHtml(g.name)}</span>
          <span class="occ-tag person">个人 · status ${escHtml(g.status)}</span>
          <span class="mini">共 ${g.spans.length} 段${meta ? " · " + escHtml(meta) : ""}</span>
        </div>
        <div class="occ-items">${items}</div>
      </div>`;
    }
    html += `</div>`;
  }

  // ── 其他时段散客（按起始时间分桶，折叠）──
  if (day.length) {
    const byStart = new Map();
    for (const sp of day) {
      if (!byStart.has(sp.start)) byStart.set(sp.start, []);
      byStart.get(sp.start).push(sp);
    }
    const starts = [...byStart.keys()].sort();
    const peopleSet = new Set(day.map(s => s.name));

    html += `<details class="occ-fold">
      <summary>👥 其他时段散客 (白天 08:00-18:00) —— 共 ${peopleSet.size} 人 / ${day.length} 段，点击展开</summary>
      <div style="margin-top:12px;">`;

    for (const st of starts) {
      const items = byStart.get(st).sort((a, b) =>
        a.court - b.court || a.end.localeCompare(b.end));
      const rows = items.map(s =>
        `<span class="occ-item">${s.court}号场 · <b style="color:#c9d1d9;">${escHtml(s.name)}</b> · ${escHtml(s.start)}-${escHtml(s.end)}</span>`
      ).join("");
      html += `<div class="occ-group" style="border-left-color:#2c3440;">
        <div class="occ-head">
          <span class="start-time day">${escHtml(st)} 起</span>
          <span class="mini">${items.length} 段</span>
        </div>
        <div class="occ-items">${rows}</div>
      </div>`;
    }
    html += `</div></details>`;
  }

  box.innerHTML = html || `<div class="hint">暂无占用信息</div>`;
}

/* ── 总渲染 ── */
function render() {
  renderFree();
  renderOccupied();
}

function reset() {
  freeByStart = {};
  occByCourt  = {};
  render();
}

/* ── SSE 数据入口 ── */
function onResult(r) {
  if (!r || !r.ok) return;
  const c = r.court;

  // 清掉该场地的旧空闲记录
  for (const st in freeByStart) {
    freeByStart[st] = freeByStart[st].filter(x => x.court !== c);
    if (!freeByStart[st].length) delete freeByStart[st];
  }

  if (Array.isArray(r.blocks)) {
    occByCourt[c] = mergeBlocks(r.blocks);
  }

  const a = r.avail;
  if (a) {
    for (const run of computeRuns(a)) {
      if (!freeByStart[run.start]) freeByStart[run.start] = [];
      freeByStart[run.start].push({ court: c, start: run.start, end: run.end });
    }
  }
  render();
}

/* ── 日志 ── */
function addLog(e) {
  const el = $("log");
  const div = document.createElement("div");
  div.className = "l-" + e.level;
  div.textContent = `[${e.ts}] [${e.level}] ${e.msg}`;
  el.insertBefore(div, el.firstChild);
  while (el.childNodes.length > 400) el.removeChild(el.lastChild);
}

async function pollLogs() {
  try {
    const r = await fetch("/api/logs?since=" + lastLog);
    const d = await r.json();
    for (const e of d.logs) { lastLog = e.seq; addLog(e); }
  } catch {}
}

function connectSSE(since) {
  if (sse) sse.close();
  sse = new EventSource("/api/stream?since=" + since);
  sse.onopen  = () => $("sse-dot").classList.add("on");
  sse.onerror = () => $("sse-dot").classList.remove("on");
  sse.addEventListener("refresh.result", ev => onResult(JSON.parse(ev.data).data));
  sse.addEventListener("refresh.done", () => {
    refreshRunning = false;
    const b = $("btn-refresh"); b.disabled = false; b.textContent = "刷新场地";
  });
}

/* ── 按钮 ── */
$("btn-save").onclick = async () => {
  const token = $("token").value.trim();
  if (!token) return alert("请填写 token");
  const d = new Date(); d.setDate(d.getDate() + +$("date-offset").value);
  const date = d.getFullYear() + "-"
    + String(d.getMonth() + 1).padStart(2, "0") + "-"
    + String(d.getDate()).padStart(2, "0");
  const r = await fetch("/api/config", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({token, target_date: date}),
  });
  const j = await r.json();
  $("cur-date").textContent = j.target_date;
  reset();
};

$("btn-vid").onclick = () =>
  fetch(vidRunning ? "/api/vid/stop" : "/api/vid/start", {method: "POST"});

$("btn-refresh").onclick = async () => {
  if (refreshRunning) return;
  reset();
  const d = await (await fetch("/api/refresh", {method: "POST"})).json();
  if (!d.ok) return alert(d.msg);
  refreshRunning = true;
  const b = $("btn-refresh"); b.disabled = true; b.textContent = "刷新中…";
};

$("btn-auto").onclick = async () => {
  if (autoRunning) {
    await fetch("/api/auto/stop", {method: "POST"});
    return;
  }
  const body = {
    slot_start: $("auto-ss").value, slot_end: $("auto-se").value,
    refresh_at: $("auto-rt").value.trim(), submit_at: $("auto-st").value.trim(),
    max_orders: +$("auto-mo").value,
  };
  const d = await (await fetch("/api/auto/start", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  })).json();
  if (!d.ok) alert(d.msg);
};

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-court]");
  if (!el) return;
  fetch("/api/reserve", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      court_no: +el.dataset.court,
      start: el.dataset.start, end: el.dataset.end,
    }),
  });
});

setInterval(async () => {
  try {
    const d = await (await fetch("/api/vid/state")).json();
    $("vid-count").textContent = d.count;
    vidRunning = d.running;
    $("btn-vid").textContent = vidRunning ? "停止 VID" : "启动 VID";
    const s = d.stats[d.stats.length - 1];
    $("last-solve").textContent = s
      ? `最近 solve：${s.ok ? s.total_ms + "ms" : "失败"}`
      : "最近 solve：-";
  } catch {}
  try {
    const d = await (await fetch("/api/auto/state")).json();
    autoRunning = d.running;
    $("btn-auto").textContent = autoRunning ? "停止全自动" : "启动全自动";
    if (autoRunning || d.phase === "done") {
      $("auto-status").style.display = "";
      $("auto-phase").textContent = d.phase;
      $("auto-msg").textContent = d.msg;
      $("auto-cands").textContent = (d.candidates || []).map(c => c.name).join(" / ") || "无";
      $("auto-applied").textContent =
        (d.applied || []).map(a => `${a.name}${a.ok ? "✓" : "✗"}`).join(" / ") || "无";
    }
  } catch {}
}, 1000);

window.addEventListener("DOMContentLoaded", async () => {
  reset();
  pollLogs(); setInterval(pollLogs, 1000);
  try {
    const d = await (await fetch("/api/refresh/seq")).json();
    connectSSE(d.seq);
  } catch { connectSSE(0); }
});
</script>
</body>
</html>
