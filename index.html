<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>羽毛球场预约</title>
<style>
:root{
  --bg:#0d1117; --bg-elev:#161b22; --bg-input:#0b0f16;
  --border:#262d38; --border-strong:#39414d;
  --text:#e6edf3; --text-dim:#8b949e; --text-mute:#6b7280;
  --primary:#2f81f7; --primary-hover:#4b95f9;
  --success:#2ea043; --success-hover:#3fb950;
  --purple:#a371f7; --orange:#f0883e;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
       "PingFang SC", "Microsoft YaHei", sans-serif;
  max-width: 1080px; margin: 24px auto; padding: 0 20px;
  min-height: 100vh; color: var(--text);
  background:
    radial-gradient(1100px 560px at 15% -12%, rgba(47,129,247,.13), transparent 62%),
    radial-gradient(900px 520px at 100% 0%, rgba(163,113,247,.10), transparent 58%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
h1 { font-size: 22px; margin: 0 0 18px; font-weight: 700; letter-spacing: .3px; }
.card {
  background: var(--bg-elev); border: 1px solid var(--border);
  padding: 12px 16px; border-radius: 10px;
  box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 28px -20px rgba(0,0,0,.9);
  margin-bottom: 12px;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row label { font-size: 13px; color: var(--text-dim); }
input, select {
  padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 13px;
  background: var(--bg-input); color: var(--text);
  transition: border-color .15s, box-shadow .15s, background .15s;
}
input::placeholder { color: #58616e; }
input:hover, select:hover { border-color: var(--border-strong); }
input:focus, select:focus {
  outline: none; border-color: var(--primary);
  background: #0e1520;
  box-shadow: 0 0 0 3px rgba(47,129,247,.18);
}
select option { background: var(--bg-elev); color: var(--text); }
#token { flex: 1; min-width: 260px; }
button {
  padding: 7px 16px; border: 1px solid transparent; border-radius: 6px;
  cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background .15s, border-color .15s, filter .15s, transform .06s;
}
button:active:enabled { transform: translateY(1px); }
button:disabled {
  background: #21262d !important; color: #55606e !important;
  border-color: var(--border) !important; cursor: not-allowed;
}
.primary { background: var(--primary); color: #fff; }
.primary:hover:enabled { background: var(--primary-hover); }
.auto { background: linear-gradient(180deg, #3b8ef8, #1f6feb); color: #fff; }
.auto:hover:enabled { filter: brightness(1.12); }
.dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #3a4351; transition: background .2s, box-shadow .2s;
}
.dot.on { background: var(--success-hover); box-shadow: 0 0 0 3px rgba(63,185,80,.16); }
.mini { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; color: var(--text-dim); }
.section { margin-top: 18px; }
.section h2 {
  font-size: 14px; color: #c3cbd6; margin: 0 0 8px;
  padding-left: 8px; border-left: 3px solid var(--primary); font-weight: 600;
}
.grid, .avail-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.court {
  padding: 10px 18px; border-radius: 8px; font-size: 13px;
  background: linear-gradient(180deg, #3588f8, #1f6feb);
  color: #fff; cursor: pointer; text-align: center;
  min-width: 66px; user-select: none;
  border: 1px solid rgba(255,255,255,.10);
  box-shadow: 0 1px 2px rgba(0,0,0,.45);
  transition: filter .15s, box-shadow .15s, transform .06s;
}
.court:hover { filter: brightness(1.12); box-shadow: 0 6px 18px -6px rgba(47,129,247,.75); }
.court:active { transform: translateY(1px); }
.avail-btn {
  padding: 9px 16px; border-radius: 8px; font-size: 13px;
  background: linear-gradient(180deg, #2ea043, #217a33);
  color: #fff; border: 1px solid rgba(255,255,255,.10); cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.45);
  transition: filter .15s, box-shadow .15s, transform .06s;
}
.avail-btn:hover { filter: brightness(1.14); box-shadow: 0 6px 18px -6px rgba(63,185,80,.7); }
.avail-btn:active { transform: translateY(1px); }
.hint { color: var(--text-mute); font-size: 12px; padding: 6px 0; }
.log {
  background: #080b10; color: #c9d1d9; border: 1px solid var(--border);
  padding: 10px 14px; border-radius: 8px;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 12px; max-height: 320px; overflow-y: auto;
  margin-top: 18px; white-space: pre-wrap; line-height: 1.55;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
}
.log .l-INFO { color: #7ee787; }
.log .l-WARNING { color: #ffa657; }
.log .l-ERROR { color: #ff7b72; }
.pill {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  background: #21262d; border: 1px solid var(--border);
  color: var(--text); font-size: 12px;
}
.occ-group { border-left: 3px solid #2c3440; padding: 6px 0 8px 10px; margin-bottom: 10px; }
.occ-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.occ-name { font-size: 13px; font-weight: 600; color: #c9d1d9; }
.occ-tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.occ-tag.person { color: #79c0ff; border-color: #1f4b7a; background: #0d2338; }
.occ-tag.course { color: #d2a8ff; border-color: #4a3670; background: #1d1630; }
.occ-items { display: flex; flex-wrap: wrap; gap: 6px; }
.occ-item {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 11.5px; padding: 3px 8px; border-radius: 5px;
  background: #161d27; border: 1px solid #262d38; color: #8b949e;
}
.occ-category { margin-bottom: 20px; }
.occ-cat-title {
  font-size: 13px; color: #c3cbd6; margin: 0 0 10px 0;
  padding-bottom: 6px; border-bottom: 1px dashed #262d38; font-weight: 600;
}
.occ-cat-title .mini { font-weight: normal; color: #6b7280; }
.occ-courses { display: flex; flex-direction: column; gap: 6px; }
.course-row { display: flex; align-items: center; gap: 12px; font-size: 12px; }
.course-time {
  font-family: "SFMono-Regular", Consolas, monospace;
  color: #d2a8ff; background: #1d1630;
  padding: 2px 8px; border-radius: 4px;
  border: 1px solid #4a3670; min-width: 120px; text-align: center;
}
.course-courts { color: #8b949e; font-family: "SFMono-Regular", Consolas, monospace; }
.occ-fold { margin-top: 16px; border-top: 1px solid #262d38; padding-top: 12px; }
.occ-fold summary {
  cursor: pointer; font-size: 12px; color: #6b7280;
  user-select: none; outline: none;
}
.occ-fold summary:hover { color: #8b949e; }
.start-time {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 12px; padding: 1px 8px; border-radius: 4px; letter-spacing: .3px;
}
.start-time.free { color: #7ee787; background: #0d2818; border: 1px solid #1f5a2e; }
.start-time.day  { color: #79c0ff; background: #0d2338; border: 1px solid #1f4b7a; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: #2b333f; border-radius: 6px;
  border: 2px solid transparent; background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: #3c4552; background-clip: content-box; }
#vid-count, #cur-date { color: var(--text); font-weight: 600; }

/* ── 目标场地选择器（单选） ── */
.court-pick {
  padding: 9px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
  text-align: center; min-width: 66px; user-select: none;
  border: 1px solid var(--border); background: var(--bg-input); color: var(--text-mute);
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s, filter .15s;
}
.court-pick:hover { border-color: var(--border-strong); color: var(--text-dim); }
.court-pick.on {
  background: linear-gradient(180deg, #3588f8, #1f6feb); color: #fff;
  border-color: rgba(255,255,255,.10);
  box-shadow: 0 1px 2px rgba(0,0,0,.45), 0 6px 16px -8px rgba(47,129,247,.7);
}
.court-pick.on:hover { filter: brightness(1.1); }

#toast{
  position: fixed; top: 18px; right: 18px; z-index: 999;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast-item{
  padding: 8px 14px; border-radius: 8px; font-size: 13px;
  background: #161b22; border: 1px solid var(--border-strong);
  box-shadow: 0 8px 24px -8px rgba(0,0,0,.8);
  animation: slideIn .25s ease-out;
  max-width: 380px; word-break: break-word;
}
.toast-item.ok   { border-color: #1f5a2e; color: #7ee787; }
.toast-item.warn { border-color: #6b3e0e; color: #ffa657; }
.toast-item.err  { border-color: #6b2e2e; color: #ffa6a6; }
@keyframes slideIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: none; } }
</style>
</head>
<body>

<h1>🏸 羽毛球场预约</h1>

<div class="card row">
  <label>Token</label>
  <input id="token" placeholder="粘贴 token">
  <label>日期</label>
  <select id="date-offset">
    <option value="0">今天</option>
    <option value="1" selected>明天</option>
    <option value="2">后天</option>
  </select>
  <button class="primary" id="btn-save">保存 Token</button>
  <button class="auto" id="btn-fetch-token">🔑 自动获取 Token</button>
  <span class="mini">目标：<b id="cur-date">-</b></span>
</div>

<div class="card row">
  <span>VID 缓存：<b id="vid-count">0</b></span>
  <span class="mini"><span class="dot" id="sse-dot"></span> <span id="sse-status" role="status">SSE 连接中</span></span>
  <button class="primary" id="btn-vid">启动 VID</button>
  <button class="primary" id="btn-refresh">刷新场地</button>
  <span class="mini" id="last-solve">最近 solve：-</span>
</div>

<div class="card">
  <div class="row" style="margin-bottom:10px;">
    <label style="font-weight:700;">全自动</label>
    <label>时段</label>
    <select id="auto-ss"></select>
    <span style="color:#a371f7;">—</span>
    <select id="auto-se"></select>
    <label>Save Order At</label>
    <input id="auto-rt" style="width:105px" placeholder="20:00:05">
    <button class="auto" id="btn-auto">启动全自动</button>
  </div>
  <div class="mini" style="margin:4px 0 8px;">
    目标场地（单选；选择新场地会取消之前的选择，启动全自动时写入 config）
  </div>
  <div id="court-picker" class="grid"></div>
</div>

<div class="card" style="padding:10px 16px;">
  <div class="mini" style="display:flex;gap:18px;flex-wrap:wrap;line-height:1.9;">
    <span>📅 目标日期 <b id="p-date">-</b></span>
    <span>⏰ 时段 <b id="p-slot">-</b></span>
    <span>🚀 Save Order At <b id="p-refresh">-</b></span>
    <span>🏸 目标场 <b id="p-courts">-</b></span>
  </div>
</div>

<div class="card">
  <div class="row">
    <label style="font-weight:700;">常驻检漏</label>
    <button class="auto" id="btn-leak">启动检漏</button>
    <span class="mini">周二 / 周四 · 18:00–22:00 · 每轮间隔10秒 · 每日19:55–20:05暂停</span>
  </div>
  <div class="row" style="margin-top:10px;">
    <span class="pill" id="leak-indicator" role="status" aria-live="polite">等待连接</span>
    <span class="mini" id="leak-status">等待后端状态</span>
  </div>
  <div id="leak-found" class="row" style="margin-top:8px;"></div>
</div>

<div class="card">
  <div class="row">
    <label style="font-weight:700;">我的预约</label>
    <button class="primary" id="btn-orders">刷新订单</button>
    <span class="mini" id="orders-status">等待查询</span>
  </div>
  <div id="my-orders" style="margin-top:10px;"></div>
</div>

<div class="card" id="auto-status" style="display:none">
  <span class="pill" id="auto-phase">idle</span>
  <span class="mini" id="auto-msg" style="margin-left:10px;"></span>
  <div class="mini" style="margin-top:8px;">已申请：<span id="auto-applied">无</span></div>
</div>

<div class="section">
  <h2>实时运行日志</h2>
  <div class="log" id="log"></div>
</div>

<div class="section">
  <h2>可抢场地 <span class="mini" style="font-weight:normal;color:#6b7280;">
    (时长优先 · 同长按起始时间倒序 · 每段最多合并 2 小时 · 至 22:00)</span></h2>
  <div id="free"></div>
</div>

<div class="section">
  <h2>已被占用 <span class="mini" style="font-weight:normal;color:#6b7280;">
    (仅 08:00-22:00)</span></h2>
  <div id="occupied"></div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);

// ── 全局状态 ──
let targetCourt = 0;
let allCourtNos = [];

function toast(msg, kind="ok", ms=3200) {
  const box = $("toast");
  const el = document.createElement("div");
  el.className = "toast-item " + kind;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 250); }, ms);
}

function fillTimeSelect(sel, fromMin, toMin) {
  for (let m = fromMin; m <= toMin; m += 30) {
    const hh = String(Math.floor(m / 60)).padStart(2, "0");
    const mm = String(m % 60).padStart(2, "0");
    const val = `${hh}:${mm}`;
    const opt = document.createElement("option");
    opt.value = opt.textContent = val;
    sel.appendChild(opt);
  }
}
fillTimeSelect($("auto-ss"), 8 * 60, 21 * 60 + 30);
fillTimeSelect($("auto-se"), 8 * 60 + 30, 22 * 60);

const SCAN_START = 8 * 60;
const SCAN_END   = 22 * 60;
const MAX_SLOTS  = 4;

let sse = null;
let streamReady = false;
let snapshotReady = false;
const pendingJobs = new Set();
const state = {jobs: {}, courts: new Map(), lastLog: 0};

const escHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmtMin = m =>
  String(Math.floor(m / 60)).padStart(2, "0") + ":" +
  String(m % 60).padStart(2, "0");
const hm2min = t => {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
};

const ACTIVITY_KEYWORDS = [
  "工会", "比赛", "活动", "大会", "赛", "训练",
  "校队", "俱乐部", "考试", "赛事", "选拔","羽毛球队"
];
function isActivity(name) {
  if (!name) return false;
  return ACTIVITY_KEYWORDS.some(kw => name.includes(kw));
}
function isEvening(start) { return start >= "19:00" && start <= "21:30"; }

function isFree(avail, t) {
  if (!avail) return false;
  if (avail[t] === "1") return true;
  const p = t.split(":");
  return avail[p[0].padStart(2, "0") + ":" + p[1]] === "1"
      || avail[String(+p[0]) + ":" + p[1]] === "1";
}

function computeRuns(avail) {
  const runs = [];
  let i = SCAN_START;
  while (i < SCAN_END) {
    if (!isFree(avail, fmtMin(i))) { i += 30; continue; }
    let j = i;
    while (j < SCAN_END && isFree(avail, fmtMin(j))) j += 30;
    let s = i;
    while (s < j) {
      const e = Math.min(s + MAX_SLOTS * 30, j);
      runs.push({ start: fmtMin(s), end: fmtMin(e) });
      s += MAX_SLOTS * 30;
    }
    i = j;
  }
  return runs;
}

function mergeBlocks(blocks) {
  const busy = blocks.filter(b => b && b.status != null && b.status !== "1");
  const out = [];
  for (const b of busy) {
    const key = b.customerName || `__s${b.status}__`;
    const last = out[out.length - 1];
    if (last && last._k === key && last.end === b.time) {
      last.end = b.endTime;
      continue;
    }
    out.push({
      _k: key, start: b.time, end: b.endTime,
      status: b.status, name: b.customerName,
      code: b.customerCode, tel: b.customerTel, type: b.type,
    });
  }
  return out;
}

function groupByName(spans) {
  const map = new Map();
  for (const sp of spans) {
    const key = sp.name || "未知";
    if (!map.has(key)) {
      map.set(key, {
        name: key, code: sp.code, tel: sp.tel,
        type: sp.type, status: sp.status, spans: [],
      });
    }
    map.get(key).spans.push(sp);
  }
  return [...map.values()].sort((a, b) =>
    a.name.localeCompare(b.name, "zh-Hans-CN"));
}

function renderFree() {
  const freeByStart = {};
  for (const r of state.courts.values()) {
    if (r.date !== $("cur-date").textContent) continue;
    for (const run of computeRuns(r.avail)) {
      (freeByStart[run.start] ||= []).push({court: r.court, ...run});
    }
  }
  const box = $("free");
  const starts = Object.keys(freeByStart);
  if (!starts.length) { box.innerHTML = `<div class="hint">暂无空闲场地</div>`; return; }

  const groups = starts.map(st => {
    const items = [...freeByStart[st]]
      .map(i => ({ ...i, dur: hm2min(i.end) - hm2min(i.start) }))
      .sort((a, b) => b.dur - a.dur || a.court - b.court);
    return { st, items, maxDur: items[0].dur };
  });

  groups.sort((a, b) =>
    b.maxDur - a.maxDur
    || hm2min(b.st) - hm2min(a.st)
  );

  box.innerHTML = groups.map(({ st, items }) => {
    const rows = items.map(i =>
      `<button class="avail-btn"
        data-date="${escHtml($("cur-date").textContent)}" data-court="${i.court}" data-start="${i.start}" data-end="${i.end}">
        ${i.court}号场 · ${i.start}-${i.end}
      </button>`).join("");
    return `<div class="occ-group" style="border-left-color:#2ea043;">
      <div class="occ-head">
        <span class="start-time free">${escHtml(st)} 起</span>
        <span class="mini">${items.length} 个场地</span>
      </div>
      <div class="avail-grid">${rows}</div>
    </div>`;
  }).join("");
}

function renderOccupied() {
  const allSpans = [];
  for (const r of state.courts.values()) {
    if (r.date !== $("cur-date").textContent) continue;
    const blocks = (r.blocks || []).filter(b => b && b.time && b.time < "22:00");
    for (const sp of mergeBlocks(blocks)) allSpans.push({...sp, court: r.court});
  }

  const box = $("occupied");
  if (!allSpans.length) { box.innerHTML = `<div class="hint">暂无占用信息</div>`; return; }

  const courses = [], activities = [], evening = [], day = [];
  for (const sp of allSpans) {
    if (sp.status === "0")               courses.push(sp);
    else if (String(sp.type || "").trim() === "PC端") activities.push(sp);
    else if (isActivity(sp.name))        activities.push(sp);
    else if (isEvening(sp.start))        evening.push(sp);
    else                                 day.push(sp);
  }

  let html = "";

  if (courses.length) {
    courses.sort((a, b) => a.start.localeCompare(b.start) || a.court - b.court);
    const timeGroups = new Map();
    for (const c of courses) {
      const k = `${c.start}-${c.end}`;
      if (!timeGroups.has(k)) timeGroups.set(k, []);
      if (!timeGroups.get(k).includes(c.court)) timeGroups.get(k).push(c.court);
    }
    html += `<div class="occ-category">
      <h3 class="occ-cat-title">📚 课程时间 <span class="mini">(固定占用)</span></h3>
      <div class="occ-courses">`;
    for (const time of [...timeGroups.keys()].sort()) {
      const courts = timeGroups.get(time).sort((a, b) => a - b);
      html += `<div class="course-row">
        <span class="course-time">${escHtml(time)}</span>
        <span class="course-courts">${courts.map(c => c + "号场").join(" / ")}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  if (activities.length) {
    html += `<div class="occ-category">
      <h3 class="occ-cat-title">🏆 活动 / 团体征用</h3>`;
    for (const g of groupByName(activities)) {
      const items = g.spans
        .sort((a, b) => a.start.localeCompare(b.start) || a.court - b.court)
        .map(s => `<span class="occ-item">${s.court}号场 ${escHtml(s.start)}-${escHtml(s.end)}</span>`)
        .join("");
      html += `<div class="occ-group" style="border-left-color:#a371f7;">
        <div class="occ-head">
          <span class="occ-name">${escHtml(g.name)}</span>
          <span class="occ-tag course">征用 / 活动</span>
          <span class="mini">共 ${g.spans.length} 段${g.type ? " · " + escHtml(g.type) : ""}</span>
        </div>
        <div class="occ-items">${items}</div>
      </div>`;
    }
    html += `</div>`;
  }

  if (evening.length) {
    html += `<div class="occ-category">
      <h3 class="occ-cat-title">🔥 晚间热门时段抢场者 <span class="mini">(18:00-22:00)</span></h3>`;
    for (const g of groupByName(evening)) {
      const items = g.spans
        .sort((a, b) => a.start.localeCompare(b.start) || a.court - b.court)
        .map(s => `<span class="occ-item" style="background:#2a1f3d;border-color:#4a3670;color:#d2a8ff;">${s.court}号场 ${escHtml(s.start)}-${escHtml(s.end)}</span>`)
        .join("");
      const meta = [g.code, g.tel, g.type].filter(Boolean).join(" · ");
      html += `<div class="occ-group" style="border-left-color:#f0883e;">
        <div class="occ-head">
          <span class="occ-name" style="color:#f0883e;">${escHtml(g.name)}</span>
          <span class="occ-tag person">个人 · status ${escHtml(g.status)}</span>
          <span class="mini">共 ${g.spans.length} 段${meta ? " · " + escHtml(meta) : ""}</span>
        </div>
        <div class="occ-items">${items}</div>
      </div>`;
    }
    html += `</div>`;
  }

  if (day.length) {
    const byStart = new Map();
    for (const sp of day) {
      if (!byStart.has(sp.start)) byStart.set(sp.start, []);
      byStart.get(sp.start).push(sp);
    }
    const starts = [...byStart.keys()].sort();
    const peopleSet = new Set(day.map(s => s.name));

    html += `<details class="occ-fold">
      <summary>👥 其他时段散客 (白天 08:00-18:00) —— 共 ${peopleSet.size} 人 / ${day.length} 段，点击展开</summary>
      <div style="margin-top:12px;">`;

    for (const st of starts) {
      const items = byStart.get(st).sort((a, b) =>
        a.court - b.court || a.end.localeCompare(b.end));
      const rows = items.map(s =>
        `<span class="occ-item">${s.court}号场 · <b style="color:#c9d1d9;">${escHtml(s.name)}</b> · ${escHtml(s.start)}-${escHtml(s.end)}</span>`
      ).join("");
      html += `<div class="occ-group" style="border-left-color:#2c3440;">
        <div class="occ-head">
          <span class="start-time day">${escHtml(st)} 起</span>
          <span class="mini">${items.length} 段</span>
        </div>
        <div class="occ-items">${rows}</div>
      </div>`;
    }
    html += `</div></details>`;
  }

  box.innerHTML = html || `<div class="hint">暂无占用信息</div>`;
}

function render() { renderFree(); renderOccupied(); }
function onResult(r) {
  if (!r || !r.ok) return;
  state.courts.set(`${r.date}/${r.court}`, r);
  render();
}

function addLog(e) {
  if (e.seq <= state.lastLog) return;
  state.lastLog = e.seq;
  const el = $("log");
  const div = document.createElement("div");
  div.className = "l-" + e.level;
  div.textContent = `[${e.ts}] [${e.level}] ${e.msg}`;
  el.insertBefore(div, el.firstChild);
  while (el.childNodes.length > 400) el.removeChild(el.lastChild);
}

// ── 目标场地选择器（严格单选） ──
function renderCourtPicker() {
  const box = $("court-picker");
  box.innerHTML = "";
  if (!allCourtNos.length) {
    box.innerHTML = `<div class="hint">未从 config 读取到场地</div>`;
    return;
  }
  for (const no of allCourtNos) {
    const el = document.createElement("div");
    const on = targetCourt === no;
    el.className = "court-pick" + (on ? " on" : "");
    el.textContent = `${no}号场`;
    el.setAttribute("role", "radio");
    el.setAttribute("aria-checked", on ? "true" : "false");
    el.addEventListener("click", async () => {
      targetCourt = no;
      renderCourtPicker();
      await saveAutoPlan({ requireCourt: true });
    });
    box.appendChild(el);
  }
}

// 从 config.toml 派生的配置同步到 UI
function applyConfig(cfg) {
  const o = cfg.order || {};
  const sel = $("date-offset");
  if (typeof o.offset_days === "number") {
    if (sel.value !== String(o.offset_days)) sel.value = String(o.offset_days);
  }
  if (o.target_date) $("cur-date").textContent = o.target_date;
  const tok = $("token");
  tok.placeholder = o.token_set
    ? "已配置（粘贴新 token 覆盖）"
    : "粘贴 token";

  const a = cfg.auto;
  $("auto-ss").value = a.slot_start;
  $("auto-se").value = a.slot_end;
  $("auto-rt").value = a.save_order_at;

  // 目标场：由 config + 场地清单驱动；旧多场地配置显示为未选择
  const courtsCfg = cfg.courts || {};
  allCourtNos = Object.keys(courtsCfg).map(Number).sort((x, y) => x - y);
  const configured = Number(a.court_no);
  targetCourt = allCourtNos.includes(configured) ? configured : 0;
  renderCourtPicker();

  // 只读参数展示
  if (o.target_date) $("p-date").textContent = o.target_date;
  $("p-slot").textContent = `${a.slot_start} - ${a.slot_end}`;
  $("p-refresh").textContent = a.save_order_at;
  $("p-courts").textContent = targetCourt ? `${targetCourt}号场` : "未配置";
}

async function readState() {
  const r = await fetch("/api/state", {cache: "no-store"});
  if (!r.ok) throw new Error(`状态读取失败：HTTP ${r.status}`);
  const d = await r.json();
  if (!d.config || !d.jobs || !Array.isArray(d.courts) || !Array.isArray(d.logs)) {
    throw new Error("状态接口格式不正确，请检查前后端版本");
  }
  return d;
}

async function loadConfig() {
  try { applyConfig((await readState()).config); }
  catch (e) { toast(e.message, "err"); }
}

// ══════════════════════════════════════════════════════
// SSE
// ══════════════════════════════════════════════════════
function renderJobs(jobs) {
  state.jobs = jobs;
  const {vid, auto, refresh, leak} = jobs;
  $("vid-count").textContent = vid.count;
  $("btn-vid").textContent = vid.running ? "停止 VID" : "启动 VID";
  const last = vid.stats.at(-1);
  $("last-solve").textContent = last ? `最近 solve：${last.ok ? last.total_ms + "ms" : "失败"}` : "最近 solve：-";
  renderControls();
  $("btn-refresh").textContent = refresh.running ? "刷新中…" : "刷新场地";
  $("btn-auto").textContent = auto.running ? "停止全自动" : "启动全自动";
  $("auto-status").style.display = auto.phase === "idle" ? "none" : "";
  $("auto-phase").textContent = auto.phase;
  $("auto-msg").textContent = auto.msg;
  $("auto-applied").textContent = (auto.applied || []).map(a => `${a.name}${a.ok ? "✓" : "✗"}`).join(" / ") || "无";
  $("btn-leak").textContent = leak.running ? "停止检漏" : "启动检漏";
  const indicator = $("leak-indicator");
  indicator.textContent = !streamReady ? "○ 状态未实时同步" : leak.running
    ? (leak.paused ? "● 定时暂停" : "● 运行中")
    : "○ 已停止";
  indicator.style.color = !streamReady ? "#ffa657" : leak.running
    ? (leak.paused ? "#ffa657" : "#7ee787") : "var(--text-dim)";
  $("leak-status").textContent = `${leak.msg} | 目标：${leak.dates.join(" / ") || "无"}`;
}

const LEAK_RESULT = {
  pending: "⏳ 待下单",
  ok: "✅ 预约成功",
  busy: "⚠ 系统繁忙",
  uncertain: "⚠ 结果不明确",
  error: "❌ 预约失败",
};

function renderLeak(d) {
  $("leak-found").replaceChildren();
  if (!d) return;
  const found = document.createElement("div");
  found.className = "mini";
  found.textContent = `🕒 发现 ${d.found_at || "-"} · ${d.court}号场 · `
    + `📅 ${d.date} ${d.start}-${d.end}`;
  const order = document.createElement("div");
  order.className = "mini";
  const result = LEAK_RESULT[d.result] || d.result || "-";
  const returned = d.result_at ? ` ${d.result_at}` : "";
  const elapsed = d.elapsed_ms ? ` · 耗时 ${d.elapsed_ms}ms` : "";
  order.textContent = `🚀 下单 ${d.order_at || "-"} · ${result}${returned}${elapsed}`;
  $("leak-found").append(found, order);
}

function renderControls() {
  for (const name of ["vid", "refresh", "auto", "leak"]) {
    $("btn-" + name).disabled = pendingJobs.has(name) ||
      (name === "refresh" && streamReady && !!state.jobs.refresh?.running);
  }
}

let ordersBusy = false;
function renderOrders(d) {
  if (!d) return;
  const box = $("my-orders");
  box.replaceChildren();
  $("orders-status").textContent = d.ok
    ? `当前有效预约 ${d.orders.length} 笔` : `订单未同步：${d.msg || "未知错误"}`;
  for (const o of d.orders || []) {
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginTop = "8px";
    const label = document.createElement("span");
    label.textContent = `${o.date} · ${o.gym} ${o.court} · ${o.start}-${o.end}`;
    const button = document.createElement("button");
    button.textContent = "取消预约";
    button.disabled = ordersBusy || !d.ok;
    button.onclick = async () => {
      if (ordersBusy || !confirm(`确定取消这笔预约？\n${label.textContent}`)) return;
      ordersBusy = true;
      button.disabled = true;
      try {
        const r = await fetch(`/api/orders/${encodeURIComponent(o.id)}`, {method: "DELETE"});
        const result = await r.json();
        toast(result.msg || "取消结果未知", result.ok ? "ok" : "err");
      } catch (e) {
        toast("取消结果未知，请刷新订单核对", "err");
      } finally {
        ordersBusy = false;
        await refreshOrders();
      }
    };
    row.append(label, button);
    box.append(row);
  }
  if (d.ok && !d.orders.length) box.textContent = "暂无有效预约";
}
async function refreshOrders() {
  if (ordersBusy) return;
  ordersBusy = true;
  $("btn-orders").disabled = true;
  $("orders-status").textContent = "正在查询订单…";
  try {
    const r = await fetch("/api/orders", {cache: "no-store"});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const result = await r.json();
    ordersBusy = false;
    renderOrders(result);
  } catch (e) {
    $("orders-status").textContent = `查询失败：${e.message}`;
    $("my-orders").querySelectorAll("button").forEach(b => b.disabled = true);
  } finally {
    ordersBusy = false;
    $("btn-orders").disabled = false;
  }
}
$("btn-orders").onclick = refreshOrders;

function applySnapshot(d) {
  applyConfig(d.config);
  state.courts = new Map(d.courts.map(r => [`${r.date}/${r.court}`, r]));
  $("log").replaceChildren();
  state.lastLog = 0;
  d.logs.forEach(addLog);
  renderJobs(d.jobs);
  renderLeak(d.leak_found);
  renderOrders(d.orders);
  render();
  snapshotReady = true;
}

function connectSSE() {
  sse = new EventSource("/api/stream");
  sse.onerror = () => {
    streamReady = false;
    $("sse-dot").classList.remove("on");
    $("sse-status").textContent = "SSE 断开，正在重连";
    $("leak-indicator").textContent = "○ 连接断开";
    $("leak-indicator").style.color = "#ffa657";
    $("leak-status").textContent = "等待重连，当前任务状态未知";
    renderControls();
  };
  sse.addEventListener("snapshot", ev => {
    try {
      streamReady = true;
      applySnapshot(JSON.parse(ev.data));
      $("sse-dot").classList.add("on");
      $("sse-status").textContent = "SSE 已连接";
    } catch (e) {
      streamReady = false;
      $("sse-dot").classList.remove("on");
      $("sse-status").textContent = "SSE 状态解析失败";
      renderControls();
      toast("状态解析失败：" + e.message, "err");
      console.error(e);
    }
  });
  sse.addEventListener("orders.updated", ev => renderOrders(JSON.parse(ev.data).data));
  sse.addEventListener("jobs", ev => renderJobs(JSON.parse(ev.data).data));
  sse.addEventListener("log", ev => addLog(JSON.parse(ev.data).data));
  sse.addEventListener("leak.found", ev => renderLeak(JSON.parse(ev.data).data));
  sse.addEventListener("refresh.result", ev => onResult(JSON.parse(ev.data).data));
  sse.addEventListener("refresh.reset", ev => {
    const date = JSON.parse(ev.data).data.date;
    for (const [key, r] of state.courts) if (r.date === date) state.courts.delete(key);
    render();
  });
  sse.addEventListener("config.updated", ev => {
    applyConfig(JSON.parse(ev.data).data);
    render();
  });

  sse.addEventListener("order.result", ev => {
    const d = JSON.parse(ev.data).data || {};
    if (d.kind === "ok") refreshOrders();
    const kind  = d.kind === "ok" ? "ok"
                : (d.kind === "busy" || d.kind === "uncertain") ? "warn" : "err";
    const label = d.label || (d.kind === "ok" ? "✅ 预约成功"
                             : d.kind === "busy" ? "⚠ 系统繁忙"
                             : d.kind === "uncertain" ? "⚠ 结果不明确"
                             : "❌ 下单失败");
    const name  = d.name || (d.court ? `${d.court}号场` : "");
    const msg   = d.msg ? `  —  ${d.msg}` : "";
    const code  = (d.code != null && d.code !== "") ? `  [code=${d.code}]` : "";
    toast(`${label} · ${d.date || ""} ${name}${code}${msg}`, kind, 5000);
  });
}

// ── 全自动参数：变更即写回 config.toml，多设备共享 ──
async function saveAutoPlan({requireCourt = false} = {}) {
  if (requireCourt && !targetCourt) {
    toast("请先选择一个目标场地", "err");
    return false;
  }
  const body = {
    slot_start: $("auto-ss").value,
    slot_end:   $("auto-se").value,
    save_order_at: $("auto-rt").value.trim(),
  };
  if (targetCourt) body.court_no = targetCourt;
  const r = await fetch("/api/config", {
    method: "PATCH", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!j.ok) {
    toast("全自动参数保存失败：" + (j.msg || ""), "err", 3000);
    return false;
  }
  return true;
}
["auto-ss", "auto-se", "auto-rt"].forEach(id =>
  $(id).addEventListener("change", saveAutoPlan));

// ── 日期切换：自动保存 ──
$("date-offset").onchange = async () => {
  const sel = $("date-offset");
  const label = sel.selectedOptions[0].textContent;
  sel.disabled = true;
  try {
    const r = await fetch("/api/config", {
      method: "PATCH", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ offset_days: +sel.value }),
    });
    const j = await r.json();
    if (!j.ok) {
      toast(j.msg || "日期保存失败", "err");
      await loadConfig();
      return;
    }
    toast(`日期已切换到「${label}」→ ${j.target_date || ""}`, "ok", 2000);
  } catch (e) {
    toast("请求失败：" + e, "err", 3000);
    await loadConfig();
  } finally {
    sel.disabled = false;
  }
};

// ── 保存 token ──
$("btn-save").onclick = async () => {
  const tok = $("token").value.trim();
  if (!tok) { toast("Token 为空，无需保存", "err"); return; }
  const r = await fetch("/api/config", {
    method: "PATCH", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ token: tok }),
  });
  const j = await r.json();
  if (!j.ok) { toast(j.msg || "保存失败", "err"); return; }
  $("token").value = "";
  toast("Token 已保存", "ok");
};

$("btn-fetch-token").onclick = async () => {
  const b = $("btn-fetch-token");
  b.disabled = true;
  const old = b.textContent;
  b.textContent = "🔑 抓取中…";
  toast("正在刷新预约窗口，请稍等…", "ok", 1600);
  try {
    const d = await (await fetch("/api/token/fetch", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({}),
    })).json();

    if (d.ok) {
      b.textContent = `✅ ${d.token_preview}`;
      toast(`Token 获取成功：${d.token_preview}`, "ok", 3600);
    } else {
      toast(d.msg || "获取失败", "err", 3000);
      b.textContent = old;
    }
  } catch (e) {
    toast("请求失败：" + e, "err", 3000);
    b.textContent = old;
  } finally {
    setTimeout(() => { b.disabled = false; b.textContent = old; }, 1200);
  }
};

async function setJob(name, running) {
  if (pendingJobs.has(name)) return;
  pendingJobs.add(name);
  renderControls();
  const label = {vid: "VID", refresh: "刷新场地", auto: "全自动", leak: "检漏"}[name];
  try {
    // HTTP commands do not depend on the SSE connection.
    // Read current state before toggling when real-time data is unavailable.
    if (!snapshotReady || !streamReady) {
      const d = await readState();
      if (!snapshotReady) applySnapshot(d);
      else if (!streamReady) renderJobs(d.jobs);
    }
    running ??= !state.jobs[name]?.running;
    if (name === "refresh" && state.jobs.refresh?.running) {
      toast("刷新任务正在运行", "warn");
      return;
    }
    if (name === "auto" && running) {
      if (!targetCourt) return toast("请先选择一个目标场地", "err");
      if (!await saveAutoPlan({requireCourt: true})) return;
    }
    const body = {running};
    if (name === "refresh") body.date = $("cur-date").textContent;
    toast(`${label}：正在提交请求…`, "ok", 1500);
    const r = await fetch(`/api/jobs/${name}`, {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) {
      const detail = d.msg || (typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail || ""));
      throw new Error(`${label}失败${r.ok ? "" : `（HTTP ${r.status}）`}：${detail || "后端未确认操作"}`);
    }
    toast(`${label}：${running ? "启动" : "停止"}请求已确认`, "ok");
    if (!streamReady) {
      const snapshot = await readState();
      if (!streamReady) applySnapshot(snapshot);
    }
    return true;
  } catch (e) {
    toast(e.message || String(e), "err", 5000);
    console.error(e);
    return false;
  } finally {
    pendingJobs.delete(name);
    renderControls();
  }
}
$("btn-vid").onclick = () => setJob("vid");
$("btn-refresh").onclick = () => setJob("refresh", true);
$("btn-auto").onclick = () => setJob("auto");
$("btn-leak").onclick = () => setJob("leak");

// ── 点击场地：立即 ack，结果走 SSE ──
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-court]");
  if (!el) return;

  const courtNo = +el.dataset.court;
  const start   = el.dataset.start;
  const end     = el.dataset.end;
  const name    = `${courtNo}号场 ${start}-${end}`;

  try {
    const r = await fetch("/api/reserve", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ court_no: courtNo, start, end, date: el.dataset.date }),
    });
    const d = await r.json();

    if (d.accepted) {
      toast(`⏳ 提交中：${name}…`, "ok", 1500);
    } else {
      const kind = d.kind === "warn" ? "warn" : "err";
      toast(`${d.label || "❌ 无法提交"} · ${name}`
            + (d.msg ? `  —  ${d.msg}` : ""), kind, 4000);
    }
  } catch (e) {
    toast(`❌ 请求失败：${e}`, "err", 4000);
  }
});

window.addEventListener("DOMContentLoaded", async () => {
  connectSSE();
  refreshOrders();
  try {
    const d = await readState();
    if (!streamReady) applySnapshot(d);
  } catch (e) {
    if (!snapshotReady) toast(e.message + "，请确认已启动新版 app.py", "err", 6000);
  }
});
</script>
